server {
    # Non-privileged port so the image can run as a non-root user
    # (e.g. Kubernetes runAsNonRoot) without needing CAP_NET_BIND_SERVICE.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 11ty emits directory-style permalinks (/2024/01/01/slug/), so try the
    # directory's index.html before giving up.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
