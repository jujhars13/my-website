<script>
// Enhance native audio elements with a large, mobile-friendly custom player
document.querySelectorAll('audio[controls]').forEach((audio) => {
  audio.classList.add('custom-enhanced');
  audio.removeAttribute('controls');

  var player = document.createElement('div');
  player.className = 'audio-player';

  var back = document.createElement('button');
  back.className = 'skip-btn skip-back';
  back.setAttribute('aria-label', 'Rewind 15 seconds');
  back.innerHTML = '&#8634;<span class="skip-label">15</span>';

  var btn = document.createElement('button');
  btn.className = 'play-btn';
  btn.setAttribute('aria-label', 'Play');
  btn.innerHTML = '&#9654;';

  var fwd = document.createElement('button');
  fwd.className = 'skip-btn skip-fwd';
  fwd.setAttribute('aria-label', 'Forward 15 seconds');
  fwd.innerHTML = '&#8635;<span class="skip-label">15</span>';

  var track = document.createElement('div');
  track.className = 'player-track';

  var bar = document.createElement('div');
  bar.className = 'progress-bar-container';
  var fill = document.createElement('div');
  fill.className = 'progress-bar-fill';
  var thumb = document.createElement('div');
  thumb.className = 'progress-bar-thumb';
  bar.appendChild(fill);
  bar.appendChild(thumb);

  var time = document.createElement('div');
  time.className = 'player-time';
  time.textContent = '0:00 / 0:00';

  track.appendChild(bar);
  track.appendChild(time);
  player.appendChild(back);
  player.appendChild(btn);
  player.appendChild(fwd);
  player.appendChild(track);

  audio.parentNode.insertBefore(player, audio.nextSibling);

  function fmt(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  btn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  });

  function skip(seconds) {
    var dur = audio.duration || 0;
    audio.currentTime = Math.max(0, Math.min(dur, audio.currentTime + seconds));
  }

  back.addEventListener('click', () => skip(-15));
  fwd.addEventListener('click', () => skip(15));

  audio.addEventListener('play', () => {
    btn.innerHTML = '&#9646;&#9646;';
    btn.setAttribute('aria-label', 'Pause');
  });

  audio.addEventListener('pause', () => {
    btn.innerHTML = '&#9654;';
    btn.setAttribute('aria-label', 'Play');
  });

  function render(pct) {
    fill.style.width = pct + '%';
    thumb.style.left = pct + '%';
  }

  audio.addEventListener('timeupdate', () => {
    var dur = audio.duration || 0;
    var pct = dur ? (audio.currentTime / dur) * 100 : 0;
    if (!dragging) render(pct);
    time.textContent = fmt(audio.currentTime) + ' / ' + fmt(dur);
  });

  audio.addEventListener('ended', () => {
    render(0);
  });

  // Drag-to-scrub: pointer events cover mouse + touch with a single code path.
  // setPointerCapture keeps the gesture bound to the bar even if the finger
  // strays off it, and CSS touch-action:none stops the page from scrolling
  // while scrubbing — both essential for a usable mobile slider.
  var dragging = false;

  function seekToClientX(clientX) {
    if (!audio.duration) return;
    var rect = bar.getBoundingClientRect();
    var ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;
    render(ratio * 100);
  }

  bar.addEventListener('pointerdown', (e) => {
    dragging = true;
    bar.setPointerCapture(e.pointerId);
    seekToClientX(e.clientX);
  });

  bar.addEventListener('pointermove', (e) => {
    if (dragging) seekToClientX(e.clientX);
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    bar.releasePointerCapture(e.pointerId);
  }

  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
});
</script>
