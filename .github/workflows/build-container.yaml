name: Build and push container

on:
  # Runs after the Pages deploy workflow finishes, so the container only ever
  # gets built from a commit that successfully deployed.
  workflow_run:
    workflows: ["Build and deploy to GitHub Pages"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Deliberately NOT the "pages" group — this must not block or be blocked by the
# deploy workflow's concurrency group.
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run fires on failure too; only build on a green deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # workflow_run checks out the default branch by default, which may
          # have moved on — pin to the exact commit that was deployed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jujhars13/my-website
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
